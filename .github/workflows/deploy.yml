name: deploy s29 bots

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s29-bots-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, s29-bots]
    steps:
      - name: Check out the production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare deployment archive
        run: >-
          git archive --format=tar.gz --output="$RUNNER_TEMP/s29-bots.tar.gz"
          "$GITHUB_SHA"
          Dockerfile .dockerignore compose.yaml package.json package-lock.json
          tsconfig.json src

      - name: Deploy to Hostinger
        run: |
          sudo -n /usr/local/sbin/deploy_s29_bots "$GITHUB_SHA" \
            < "$RUNNER_TEMP/s29-bots.tar.gz"
